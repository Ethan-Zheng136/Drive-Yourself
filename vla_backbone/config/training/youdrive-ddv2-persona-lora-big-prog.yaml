name: youdrive-ddv2-persona-lora-big-prog
description: big Style-LoRA SFT (CE) + ego-PROGRESS matching loss to the DDv2 teacher. Injects the
             SAFE-COMPATIBLE part of DDv2 style (assertive forward progress / ego_progress) without
             the unsafe raw-jerk part. loss = CE + w * relu(progress_DDv2 - progress_student) on the
             differentiable expected trajectory. L2 OFF (isolate the progress effect). r=64,
             alpha=128, attn+MLP, 6 epochs. No KL/GRPO.

model:
  use_cot: false
  pretrained_model_path: /mnt/pfs/zhengguantian/autovla/ckpts/Qwen2.5-VL-3B-Instruct
  sft_model_path: /mnt/pfs/zhengguantian/autovla/ckpts/AutoVLA/AutoVLA_PDMS_89.ckpt   # base init
  train_vision_backbone: false
  train_lm_backbone: true
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  lora:
    use: true
    task_type: CAUSAL_LM
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    r: 64
    alpha: 128
    dropout: 0.05
    bias: none
  # L2 off to isolate the progress effect (CE + progress only).
  l2:
    use: false
    weight: 0.1
    loss_type: mse
  # === ego-progress matching loss (NEW) ===
  # loss = weight * relu(progress_DDv2 - progress_student); progress = net forward displacement of
  # the differentiable expected trajectory. one_sided=true => only penalize under-progress vs DDv2.
  progress:
    use: true
    weight: 0.1
    one_sided: true
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

training:
  batch_size: 1
  learning_rate: 1.0e-4
  epochs: 6
  num_workers: 4
  weight_decay: 0.01
  lr_warmup_step: 200
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null
  accumulate_grad_batches: 4

data:
  train:
      json_dataset_path:
        - /mnt/pfs/zhengguantian/autovla/persona/nocot_ddv2_teacher12k
      sensor_data_path:
        - /root/workspace/closed_loop/data/navsim_train/sensor_blobs/trainval
  val:
      json_dataset_path: /mnt/pfs/zhengguantian/autovla/persona/nocot_ddv2_teacher12k
      sensor_data_path: /root/workspace/closed_loop/data/navsim_train/sensor_blobs/trainval

inference:
  batch_size: 1
  num_workers: 2
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0
