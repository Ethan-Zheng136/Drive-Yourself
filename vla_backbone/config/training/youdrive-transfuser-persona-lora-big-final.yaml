name: youdrive-transfuser-persona-lora-big-final
description: FINAL Stage-1 Style-LoRA SFT imitating TransFuser trajectories. Byte-for-byte the same
             recipe as youdrive-ddv2-persona-lora-big-final / -big-l2 (r=64, alpha=128, LoRA on
             attn+MLP, 6 epochs, CE + w_l2*L2 auxiliary loss, lr=1e-4). ONLY the teacher training
             data (nocot_transfuser_teacher12k) and the save dir (SAVE_DIR=lora_ckpts/
             transfuser_big_final -> adapter at .../lora_final) differ from DDv2. NOTE - unlike
             DDv2, no navtest teacher dump exists for TransFuser, so this trains on the navtrain12k
             half only (the "_final" name reflects the DDv2 lineage / save-dir convention, NOT a
             train+test union). sensor_data_path is the trainval sensor dir (navtrain teacher JSONs
             embed absolute camera paths). Save dir is set via the SAVE_DIR env of run_sft_lora.py.

model:
  use_cot: false
  pretrained_model_path: /mnt/pfs/zhengguantian/autovla/ckpts/Qwen2.5-VL-3B-Instruct
  sft_model_path: /mnt/pfs/zhengguantian/autovla/ckpts/AutoVLA/AutoVLA_PDMS_89.ckpt   # base init
  train_vision_backbone: false
  train_lm_backbone: true
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  lora:
    use: true
    task_type: CAUSAL_LM
    # bigger capacity: attention + MLP (gate/up/down) instead of attention-only
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    r: 64
    alpha: 128
    dropout: 0.05
    bias: none
  # === auxiliary L2 trajectory-regression loss (UNCHANGED from DDv2 big-final) ===
  l2:
    use: true
    weight: 0.1
    loss_type: mse
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

training:
  batch_size: 1
  learning_rate: 1.0e-4
  epochs: 6
  num_workers: 4
  weight_decay: 0.01
  lr_warmup_step: 200
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null
  accumulate_grad_batches: 4

data:
  train:
      json_dataset_path:
        - /mnt/pfs/zhengguantian/autovla/persona/nocot_transfuser_teacher12k
      sensor_data_path:
        - /root/workspace/closed_loop/data/navsim_train/sensor_blobs/trainval
  val:
      json_dataset_path: /mnt/pfs/zhengguantian/autovla/persona/nocot_transfuser_teacher12k
      sensor_data_path: /root/workspace/closed_loop/data/navsim_train/sensor_blobs/trainval

inference:
  batch_size: 1
  num_workers: 2
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0
