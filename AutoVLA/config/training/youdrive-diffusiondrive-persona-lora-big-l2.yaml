name: youdrive-diffusiondrive-persona-lora-big-l2
description: Bigger-capacity Style-LoRA SFT on AutoVLA imitating DiffusionDrive trajectories, PLUS an
             auxiliary L2 trajectory-regression loss. r=64, alpha=128, LoRA on attn+MLP, 6 epochs.
             Objective L = CE + w_l2 * L2(expected_trajectory, DiffusionDrive_gt_trajectory). The expected
             trajectory is a differentiable decode (softmax over the ACTION sub-vocab -> expected
             motion primitive -> kinematic rollout), giving a dense continuous geometric signal
             that bypasses the action-token quantization ceiling. Set l2.use=false to recover the
             pure-CE big config exactly. No KL/GRPO.

model:
  use_cot: false
  pretrained_model_path: /mnt/pfs/zhengguantian/autovla/ckpts/Qwen2.5-VL-3B-Instruct
  sft_model_path: /mnt/pfs/zhengguantian/autovla/ckpts/AutoVLA/AutoVLA_PDMS_89.ckpt   # base init
  train_vision_backbone: false
  train_lm_backbone: true
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  lora:
    use: true
    task_type: CAUSAL_LM
    # bigger capacity: attention + MLP (gate/up/down) instead of attention-only
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    r: 64
    alpha: 128
    dropout: 0.05
    bias: none
  # === auxiliary L2 trajectory-regression loss (NEW) ===
  # L = CE + weight * L2(expected_trajectory, DiffusionDrive_gt_trajectory[x,y]).
  # weight chosen so w_l2*L2 is comparable to CE at init (see smoke report). loss_type: mse|smooth_l1.
  l2:
    use: true
    weight: 0.1
    loss_type: mse
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

training:
  batch_size: 1
  learning_rate: 1.0e-4
  epochs: 6
  num_workers: 4
  weight_decay: 0.01
  lr_warmup_step: 200
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null
  accumulate_grad_batches: 4

data:
  train:
      json_dataset_path:
        - /mnt/pfs/zhengguantian/autovla/persona/nocot_diffusiondrive_teacher12k
      sensor_data_path:
        - /root/workspace/closed_loop/data/navsim_train/sensor_blobs/trainval
  val:
      json_dataset_path: /mnt/pfs/zhengguantian/autovla/persona/nocot_diffusiondrive_teacher12k
      sensor_data_path: /root/workspace/closed_loop/data/navsim_train/sensor_blobs/trainval

inference:
  batch_size: 1
  num_workers: 2
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0
