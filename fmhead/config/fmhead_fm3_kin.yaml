# fmhead_fm3_kin -- VARIANT B ("fm3-kin"): the fm2 no-style feasibility GOLD full-FT
# recipe (VLM LM-backbone + FMHead trained JOINTLY, vision frozen, style OFF/s=0,
# human-GT navtrain, FMHead flow loss) PLUS a KINEMATIC unicycle parametrization --
# feasible BY CONSTRUCTION -- and more epochs.
#
# Changes vs config/fmhead-sft-full.yaml (the GOLD recipe):
#   * fmhead.constraint.mode: kinematic  <- NEW: flow in (a_long, yaw_rate) CONTROL space;
#                                            integrate a unicycle -> xy + NATIVE heading
#                                            (drops the atan2 append_heading hack).
#   * fmhead.constraint.{accel_max,yawrate_max,v_max}  <- feasibility caps (tanh-equivalent
#                                            hard clamps at decode) => acute kinks impossible.
#   * fmhead.constraint.jerk_weight      <- light control-smoothness insurance (option c)
#   * normalizer_path -> CONTROL-space stats (traj_norm_stats_ctrl.json, built from GT)
#   * fmhead.num_steps: 30 -> 100        <- option d
#   * training.epochs: 10 -> 15
#   * ckpt_dir -> NEW PFS dir, distinct from GOLD and all existing runs
#
# LOSS FORMULATION (documented): flow-matching in CONTROL space on GT-derived controls
# (invert GT xy -> (a_long, yaw_rate) once per sample with v0=first_gt_step; z-score with
# the control stats). This keeps the SAME stable rectified-flow loss geometry as fm2 -- only
# the target space changes -- so retrain risk is minimal vs a through-integrator xy-MSE. GT
# controls are real/feasible, so the target teaches feasibility; the decode caps clip the
# (heading-noise) tail. A light jerk penalty on the control-jerk (da/dt) mops up roughness.
#
# CAPS (from GT control percentiles over 11988 navtrain scenes, see build_ctrl_norm_stats.py):
#   |a_long|  human p99=1.9, p99.9=5.8 m/s^2   -> accel_max=5.0 (covers DDv2 aggression ~5)
#   |yawrate| human p99=0.46 rad/s (>p99.9 tail is atan2 heading-noise, ~pi/dt flips)
#                                              -> yawrate_max=1.0 (28.6 deg/step max; no acute kink)
#
# mode:none would be byte-identical to fm2 -> the GOLD 0.9088 head still loads/infers unchanged.

model:
  use_cot: false
  pretrained_model_path: /mnt/pfs/zhengguantian/autovla/ckpts/Qwen2.5-VL-3B-Instruct
  train_vision_backbone: false       # freeze vlm.visual
  train_lm_backbone: true            # train vlm.model (+ lm_head) jointly with FMHead
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  sft_model_path: /mnt/pfs/zhengguantian/autovla/ckpts/AutoVLA/AutoVLA_PDMS_89.ckpt  # base warm-start
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

# training hparams == qwen2.5-vl-3B-mix-sft, EXCEPT epochs 10 -> 15
training:
  batch_size: 1
  learning_rate: 2.0e-5
  epochs: 15
  num_workers: 4
  weight_decay: 0.01
  lr_warmup_step: 500
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null
  accumulate_grad_batches: 4

# HUMAN-GT navtrain, disjoint train/val split (see prepare_gt_split.py) -- same as GOLD
data:
  train:
      json_dataset_path:
        - /mnt/pfs/zhengguantian/autovla/persona/nocot_navtrain_gt_split/train
      sensor_data_path:
        - /root/workspace/closed_loop/data/navsim_train/sensor_blobs/trainval
  val:
      json_dataset_path: /mnt/pfs/zhengguantian/autovla/persona/nocot_navtrain_gt_split/val
      sensor_data_path: /root/workspace/closed_loop/data/navsim_train/sensor_blobs/trainval

inference:
  batch_size: 1
  num_workers: 2
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0

# ---- FMHead decoder (replaces the codebook/CE decode) + fm3-kin unicycle constraint ----
fmhead:
  hidden_size: 256
  depth: 4
  num_heads: 8
  mlp_ratio: 4.0
  cond_hidden: 512
  horizon: 10
  traj_dim: 2                        # (a_long, yaw_rate) control channels (still 2-D)
  style_dropout_prob: 0.0            # style axis OFF -> no CFG dropout
  num_samples: 16
  num_steps: 100                     # option (d): 30 -> 100 Euler steps (GoalFlow=100)
  cfg_weight: 1.0

  # --- fm3-kin (variant B) kinematic unicycle constraint (ADDITIVE) ---
  constraint:
    mode: kinematic                  # flow in control space, integrate unicycle -> xy+heading
    accel_max: 5.0                   # m/s^2  |a_long| cap (>= DDv2 peak_acc ~5)
    yawrate_max: 1.0                 # rad/s  |yaw-rate| cap (28.6 deg/step; acute kinks impossible)
    v_max: 25.0                      # m/s    speed clamp
    dt: 0.5                          # s      integration step (== interval_length)
    jerk_weight: 0.01                # light control-jerk (da/dt) smoothness insurance
    curv_weight: 0.0                 # (off; yaw-rate already bounded by the cap)
    smooth_t_min: 0.5

c_reduce: mean
style_alpha: 0.0                     # s = 0 (content-only)

# ---- normalizer (CONTROL-space stats, built by build_ctrl_norm_stats.py) ----
normalizer_path: /root/workspace/fmhead/traj_norm_stats_ctrl.json

# ---- output (PFS, NEW dir, distinct from GOLD & all existing runs) ----
ckpt_dir: /mnt/pfs/zhengguantian/autovla/persona/fmhead_fm3_kin
