# fm3-aligned persona LoRA -- Hydra-MDP.  NEW RECIPE (train_lora_fm3aligned.py).
# Distill the Hydra-MDP teacher into a FRESH persona LoRA THROUGH the FROZEN fm3-kin ep6 decoder,
# so the LoRA delta aligns to the fm3-kin CONTROL space. Identical to the ddv2 fm3-aligned
# recipe EXCEPT the teacher data / LoRA lineage / output dir.
train_lora_only: true

autovla_config: training/youdrive-hydra_mdp-persona-lora-big-l2

load_sft_base: true
base_ckpt: /mnt/pfs/zhengguantian/autovla/persona/fmhead_fm3_kin/2026-07-17_12-47-42/fullft_fm3_kin_ep6_base.ckpt
lora_adapter_path: null
freeze_vlm: true

content_source: styled
style_mode: none
style_alpha: 0.0
c_reduce: mean

style_target: gt
dataset_path: /mnt/pfs/zhengguantian/autovla/persona/nocot_hydra_mdp_teacher12k

init_fmhead_ckpt: /mnt/pfs/zhengguantian/autovla/persona/fmhead_fm3_kin/2026-07-17_12-47-42/fullft_fm3_kin_ep6_head.pt

fmhead:
  hidden_size: 256
  depth: 4
  num_heads: 8
  mlp_ratio: 4.0
  cond_hidden: 512
  horizon: 10
  traj_dim: 2
  style_dropout_prob: 0.0
  num_samples: 16
  num_steps: 100
  cfg_weight: 1.0
  use_z_encoder: false
  use_style_adapter: false
  unfreeze_head: false
  constraint:
    mode: kinematic
    accel_max: 5.0
    yawrate_max: 1.0
    v_max: 25.0
    dt: 0.5
    jerk_weight: 0.01
    curv_weight: 0.0
    smooth_t_min: 0.5

normalizer_path: /root/workspace/fmhead/traj_norm_stats_ctrl.json

train:
  lr: 1.0e-4
  weight_decay: 0.01
  batch_size: 1
  accumulate_grad_batches: 4
  max_steps: 9000
  warmup_steps: 200
  grad_clip: 1.0
  log_every: 20
  ckpt_every: 1500
  num_workers: 4
  seed: 42

ckpt_dir: /mnt/pfs/zhengguantian/autovla/persona/lora_fm3aligned_hydra_mdp
