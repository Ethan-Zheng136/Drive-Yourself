# VARIANT #2 -- "fire from fm3decoder": REUSE the fm3-kin ep6 base+head, FREEZE the LM
# (and vision), train ONLY the FMHead (fm3decoder) + the jointly-fired scorer.
# == fmhead_fm3_kin_joint.yaml EXCEPT:
#   * model.train_lm_backbone: true -> false          (LM frozen)
#   * model.sft_model_path -> ep6 base                (warm-start the frozen LM at ep6)
#   * fmhead_head_init -> ep6 head                    (warm-start the FMHead at ep6)
#   * ckpt_dir -> NEW dir
# scorer fires (joint_scorer.enabled); FMHead trainable (freeze_fm_decoder: false).

model:
  use_cot: false
  pretrained_model_path: /mnt/pfs/zhengguantian/autovla/ckpts/Qwen2.5-VL-3B-Instruct
  train_vision_backbone: false
  train_lm_backbone: false           # <-- FREEZE LM: only FMHead + scorer fire
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  # warm-start the (frozen) LM from the fm3-kin ep6 base (itself full-FT'd from AutoVLA_PDMS_89)
  sft_model_path: /mnt/pfs/zhengguantian/autovla/persona/fmhead_fm3_kin/2026-07-17_12-47-42/fullft_fm3_kin_ep6_base.ckpt
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

training:
  batch_size: 1
  learning_rate: 2.0e-5
  epochs: 15
  num_workers: 4
  weight_decay: 0.01
  lr_warmup_step: 500
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null
  accumulate_grad_batches: 4

data:
  train:
      json_dataset_path:
        - /mnt/pfs/zhengguantian/autovla/persona/nocot_navtrain_gt_split/train
      sensor_data_path:
        - /root/workspace/closed_loop/data/navsim_train/sensor_blobs/trainval
  val:
      json_dataset_path: /mnt/pfs/zhengguantian/autovla/persona/nocot_navtrain_gt_split/val
      sensor_data_path: /root/workspace/closed_loop/data/navsim_train/sensor_blobs/trainval

inference:
  batch_size: 1
  num_workers: 2
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0

fmhead:
  hidden_size: 256
  depth: 4
  num_heads: 8
  mlp_ratio: 4.0
  cond_hidden: 512
  horizon: 10
  traj_dim: 2
  style_dropout_prob: 0.0
  num_samples: 16
  num_steps: 100
  cfg_weight: 1.0
  constraint:
    mode: kinematic
    accel_max: 5.0
    yawrate_max: 1.0
    v_max: 25.0
    dt: 0.5
    jerk_weight: 0.01
    curv_weight: 0.0
    smooth_t_min: 0.5

c_reduce: mean
style_alpha: 0.0
normalizer_path: /root/workspace/fmhead/traj_norm_stats_ctrl.json

# warm-start the FMHead at the fm3-kin ep6 head (extract_full_ft_ckpt.py's fm_decoder.pt)
fmhead_head_init: /mnt/pfs/zhengguantian/autovla/persona/fmhead_fm3_kin/2026-07-17_12-47-42/fullft_fm3_kin_ep6_head.pt

joint_scorer:
  enabled: true
  env_in_dim: 2048
  d_model: 256
  n_decoder_layers: 3
  metrics: v1
  loss_weight: 0.5
  freeze_fm_decoder: false            # FMHead TRAINS (variant #2)
  metric_cache: /mnt/pfs/zhengguantian/autovla/exp/metric_cache_navtrain12k

ckpt_dir: /mnt/pfs/zhengguantian/autovla/persona/fmhead_fm3_kin_joint_frozenlm
